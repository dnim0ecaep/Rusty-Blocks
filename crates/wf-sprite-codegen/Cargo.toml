[package]
name = "wf-sprite-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Translate a WarpForge sprite project into a buildable Cargo project that wraps wf-sprite-runtime."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
roxmltree = "0.20"
wf-sprite-runtime = { path = "../wf-sprite-runtime", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "wf-sprite-codegen"
path = "src/bin/cli.rs"

[[bin]]
name = "verify_sprite_examples"
path = "src/bin/verify_sprite_examples.rs"
